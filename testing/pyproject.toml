[project]
name = "pyramid-sa-testing"
version = "0.1.0"
description = "Pytest plugin for pyramid-sa"
requires-python = ">=3.13"
license = {text = "MIT"}
dependencies = [
    "pyramid-sa",
    "webtest",
    "transaction",
    "pytest-postgresql",
    "psycopg",
]

[tool.uv.sources]
pyramid-sa = { path = "..", editable = true }

[project.entry-points.pytest11]
pyramid_sa = "pyramid_sa_testing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyramid_sa_testing"]
